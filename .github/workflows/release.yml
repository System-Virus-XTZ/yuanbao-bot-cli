name: Release Build

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL dev
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Build (x86_64)
        run: |
          g++ -std=c++17 -O2 -Wall -I. main.cpp -o yuanbao-linux-x86_64 \
            -static-libstdc++ -static-libgcc -lpthread -lrt -lm -lssl -lcrypto
          strip yuanbao-linux-x86_64
          mkdir -p dist
          mv yuanbao-linux-x86_64 dist/

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-openssl

      - name: Build (x64, static)
        run: |
          g++ -std=c++17 -O2 -Wall -I. main.cpp -o main.exe \
            -static -static-libgcc -static-libstdc++ \
            -lssl -lcrypto -lws2_32 -lcrypt32 -lbcrypt
          strip main.exe
          mkdir -p dist
          mv main.exe dist/

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum main.exe yuanbao-linux-x86_64 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/main.exe
            dist/yuanbao-linux-x86_64
            dist/SHA256SUMS.txt
